name: mempalace
version: 2.0.0
description: "Local MemPalace-backed Hermes memory provider with profile-scoped storage, 31 tools, knowledge graph, palace graph tunnels, diary, and wing-filtered recall."
pip_dependencies:
  - "mempalace>=3.3.0"
hooks:
  - on_turn_start
  - on_session_end
  - on_memory_write
  - on_pre_compress
